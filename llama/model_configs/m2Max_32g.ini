version = 1

; (Optional) This section provides global settings shared across all presets.
; If the same key is defined in a specific preset, it will override the value in this global section.
[*]
c = 16384
cache-type-k = q8_0
cache-type-v = q8_0
n-gpu-layers = 999
threads = 8
cpu-range = 0-7
flash-attn = on
port = 4321
no-mmproj = true

; Prevents macOS from swapping model weights to disk when unified memory is nearly full. Swapping will completely bottleneck prompt processing.
mlock = true

; If your app sends repeated or highly overlapping prompts, the server skips recomputing shared prefixes, saving significant time.
; cache-prompt = true
; cache-reuse = 256

